
services:
  # PostgreSQL Database (already configured)
  postgres:
    image: postgres:16-alpine
    container_name: codementor_postgres
    environment:
      POSTGRES_DB: codementor
      POSTGRES_USER: codementor_user
      POSTGRES_PASSWORD: dali1992
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codementor_user -d codementor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codementor_network

  # Qdrant Vector Database (already configured)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codementor_qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codementor_network

  # Redis (Message Broker + Cache) - NEW!
  redis:
    image: redis:7-alpine
    container_name: codementor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codementor_network

  # Celery Worker (Optional - can run locally in dev) - NEW!
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: codementor_celery
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
      - celery_uploads:/app/uploads  # Shared upload directory
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://codementor_user:dali1992@postgres:5432/codementor
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - codementor_network
    restart: unless-stopped
    # Comment out in development, uncomment in production

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  celery_uploads:

networks:
  codementor_network:
    driver: bridge
