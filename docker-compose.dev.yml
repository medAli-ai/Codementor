services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: codementor_postgres
    environment:
      POSTGRES_DB: codementor
      POSTGRES_USER: codementor_user
      POSTGRES_PASSWORD: dali1992
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codementor_user -d codementor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codementor_network

  # ── Qdrant (vector database) ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codementor_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - codementor_network

  # ── Redis (message broker + cache) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codementor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codementor_network

  

  # ── pgAdmin (database GUI) ─────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: codementor_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codementor_network
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  pgadmin_data:

networks:
  codementor_network:
    driver: bridge