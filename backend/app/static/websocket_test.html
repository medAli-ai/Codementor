<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Chat Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        #status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        #chat-container {
            border: 1px solid #ddd;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f5f5f5;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            max-width: 70%;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .assistant-message {
            background-color: white;
            color: black;
            margin-right: auto;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        input[type="number"] {
            width: 100px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>WebSocket Chat Test (With Auth & Database)</h1>
    
    <div id="status" class="disconnected">⚫ Disconnected</div>
    
    <div class="input-group">
        <input type="text" id="token-input" placeholder="JWT Token (get from /api/auth/login)" />
        <button id="connect-btn" onclick="connect()">Connect</button>
    </div>
    
    <div class="input-group">
        <input type="number" id="conversation-input" placeholder="Conversation ID (optional)" />
        <input type="number" id="temperature-input" value="0.7" step="0.1" min="0" max="1" />
    </div>
    
    <div id="chat-container"></div>
    
    <div class="input-group">
        <input type="text" id="message-input" placeholder="Type your message..." disabled />
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
    
    

<script>
    let ws = null;
    let currentMessageDiv = null;  // Track the current message element
    let currentMessage = '';       // Accumulate message content
    
    function connect() {
        const token = document.getElementById('token-input').value.trim();
        
        if (!token) {
            alert('Please enter JWT token');
            return;
        }
        
        // Close existing connection
        if (ws) {
            ws.close();
        }
        
        // Connect with token in query parameter
        ws = new WebSocket(`ws://localhost:8000/api/ws/ws?token=${token}`);
        
        ws.onopen = () => {
            document.getElementById('status').className = 'connected';
            document.getElementById('status').textContent = '🟢 Connected';
            document.getElementById('message-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            console.log('Connected to WebSocket');
        };
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log('Received:', data);  // Debug log
            
            if (data.type === 'start') {
                // Start of new message - create placeholder
                currentMessage = '';
                currentMessageDiv = addMessage('', 'assistant');
                
            } else if (data.type === 'chunk') {
                // Accumulate and update message
                currentMessage += data.content;
                if (currentMessageDiv) {
                    currentMessageDiv.textContent = currentMessage;
                    // Auto-scroll
                    const container = document.getElementById('chat-container');
                    container.scrollTop = container.scrollHeight;
                }
                
            } else if (data.type === 'done') {
                // Message complete
                console.log('Message saved!');
                console.log('Conversation ID:', data.conversation_id);
                console.log('Message ID:', data.message_id);
                currentMessageDiv = null;  // Reset
                
            } else if (data.type === 'error') {
                alert('Error: ' + data.message);
            }
        };
        
        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
            alert('WebSocket error - check console');
        };
        
        ws.onclose = () => {
            document.getElementById('status').className = 'disconnected';
            document.getElementById('status').textContent = '⚫ Disconnected';
            document.getElementById('message-input').disabled = true;
            document.getElementById('send-btn').disabled = true;
            console.log('Disconnected from WebSocket');
        };
    }
    
    function sendMessage() {
        const input = document.getElementById('message-input');
        const message = input.value.trim();
        
        if (!message || !ws || ws.readyState !== WebSocket.OPEN) {
            return;
        }
        
        const conversationId = document.getElementById('conversation-input').value;
        const temperature = parseFloat(document.getElementById('temperature-input').value);
        
        // Display user message
        addMessage(message, 'user');
        
        // Send to server
        ws.send(JSON.stringify({
            message: message,
            conversation_id: conversationId ? parseInt(conversationId) : null,
            temperature: temperature
        }));
        
        input.value = '';
    }
    
    function addMessage(text, sender) {
        const container = document.getElementById('chat-container');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}-message`;
        messageDiv.textContent = text;
        container.appendChild(messageDiv);
        container.scrollTop = container.scrollHeight;
        return messageDiv;  // Return element for updates
    }
    
    // Send on Enter key
    document.getElementById('message-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
</body>
</html>
